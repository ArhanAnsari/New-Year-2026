<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy New Year | CodeWithArhan</title>

  <meta name="description" content="Premium Canva-style New Year wishing website by CodeWithArhan with countdown, fireworks, confetti, music, QR sharing and global analytics." />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    body{background:radial-gradient(circle at top,#1a1a3d,#050515);color:#fff;overflow-x:hidden}

    /* Loader */
    #loader{position:fixed;inset:0;background:linear-gradient(145deg,#050515,#0c0c2a);display:flex;align-items:center;justify-content:center;z-index:9999}
    .loader-text{font-size:2.2rem;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#00eaff,#8a2be2,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}

    /* Hero */
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative}
    h1{font-size:clamp(2.8rem,6vw,4.8rem);font-weight:800;background:linear-gradient(90deg,#00eaff,#8a2be2,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s infinite alternate}
    @keyframes glow{from{text-shadow:0 0 12px rgba(0,234,255,.4)}to{text-shadow:0 0 30px rgba(255,0,255,.9)}}
    .year{font-size:clamp(3.2rem,8vw,6.2rem);font-weight:800;margin:14px 0;letter-spacing:6px}

    /* Countdown */
    .countdown{display:flex;gap:16px;margin:22px 0;flex-wrap:wrap;justify-content:center}
    .time-box{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));padding:16px 20px;border-radius:18px;min-width:90px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .time-box span{display:block;font-size:2rem;font-weight:700}

    /* Inputs & Buttons */
    input{padding:14px 20px;border-radius:30px;border:none;outline:none;margin-top:18px;width:270px;text-align:center;font-size:1rem}
    .btn{margin-top:18px;padding:15px 38px;border-radius:50px;border:none;cursor:pointer;background:linear-gradient(135deg,#00eaff,#8a2be2);color:#fff;font-weight:600;font-size:1.05rem;transition:.35s}
    .btn:hover{transform:translateY(-3px) scale(1.08);box-shadow:0 18px 45px rgba(138,43,226,.7)}

    .wish{margin-top:18px;font-size:1.35rem}
    .share{margin-top:10px;font-size:.9rem;opacity:.9;max-width:320px;word-break:break-all}

    /* QR */
    .qr{margin-top:14px}
    .qr img{width:140px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

    /* Music */
    .music-btn{position:fixed;top:18px;right:18px;background:rgba(255,255,255,.18);border:none;color:#fff;padding:12px 18px;border-radius:30px;cursor:pointer;backdrop-filter:blur(8px)}

    /* Canvases */
    canvas{position:fixed;inset:0;pointer-events:none}

    /* Analytics */
    .analytics{position:fixed;bottom:18px;right:18px;background:rgba(255,255,255,.18);padding:12px 16px;border-radius:18px;font-size:.9rem;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.4)}

    footer{text-align:center;padding:22px;font-size:.85rem;opacity:.85}
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader"><div class="loader-text">CodeWithArhan</div></div>

  <!-- Music & Sound -->
  <audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-holiday-party-110.mp3" type="audio/mpeg">
  </audio>
  <audio id="popSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-confetti-pop-2073.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" onclick="toggleMusic()">Music</button>

  <!-- Canvases -->
  <canvas id="fireworks"></canvas>
  <canvas id="confetti"></canvas>

  <!-- Hero -->
  <section class="hero">
    <h1>Happy New Year</h1>
    <div class="year" id="year"></div>

    <div class="countdown">
      <div class="time-box"><span id="days">0</span>Days</div>
      <div class="time-box"><span id="hours">0</span>Hours</div>
      <div class="time-box"><span id="minutes">0</span>Min</div>
      <div class="time-box"><span id="seconds">0</span>Sec</div>
    </div>

    <input id="nameInput" placeholder="Enter your name" />
    <button class="btn" onclick="celebrate()">Celebrate</button>

    <div class="wish" id="wish"></div>
    <div class="share" id="share"></div>
    <div class="qr" id="qr"></div>
  </section>

  <div class="analytics">People Celebrated: <strong id="counter">0</strong></div>

  <footer>© <span id="footerYear"></span> CodeWithArhan</footer>

  <script>
    /* Loader */
    window.onload=()=>setTimeout(()=>loader.style.display='none',1500)

    /* Dates */
    const now=new Date();
    const newYear=new Date(now.getFullYear()+1,0,1);
    year.innerText=newYear.getFullYear();
    footerYear.innerText=now.getFullYear();

    /* Countdown */
    setInterval(()=>{
      const d=newYear-new Date();
      days.innerText=Math.floor(d/(1000*60*60*24));
      hours.innerText=Math.floor(d/(1000*60*60))%24;
      minutes.innerText=Math.floor(d/(1000*60))%60;
      seconds.innerText=Math.floor(d/1000)%60;
    },1000);

    /* Music */
    function toggleMusic(){bgMusic.paused?bgMusic.play():bgMusic.pause()}

    /* Global Counter (CountAPI) */
    const counterEl=counter;
    const COUNTER_KEY='codewitharhan-newyear';
    fetch(`https://api.countapi.xyz/get/${COUNTER_KEY}`).then(r=>r.json()).then(d=>counterEl.innerText=d.value||0);

    /* Fireworks */
    const fw=fireworks.getContext('2d');
    fireworks.width=innerWidth;fireworks.height=innerHeight;
    function firework(){
      for(let i=0;i<140;i++){
        fw.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
        fw.beginPath();fw.arc(Math.random()*fireworks.width,Math.random()*fireworks.height,2,0,Math.PI*2);fw.fill();
      }
      setTimeout(()=>fw.clearRect(0,0,fireworks.width,fireworks.height),550);
    }

    /* Confetti */
    const cf=confetti.getContext('2d');
    confetti.width=innerWidth;confetti.height=innerHeight;
    function confettiBurst(){
      const p=[...Array(160)].map(()=>({x:Math.random()*confetti.width,y:-20,r:Math.random()*6+2,v:Math.random()*3+2,c:`hsl(${Math.random()*360},100%,60%)`}));
      let t=setInterval(()=>{
        cf.clearRect(0,0,confetti.width,confetti.height);
        p.forEach(o=>{o.y+=o.v;cf.fillStyle=o.c;cf.beginPath();cf.arc(o.x,o.y,o.r,0,Math.PI*2);cf.fill()});
      },16);
      setTimeout(()=>{clearInterval(t);cf.clearRect(0,0,confetti.width,confetti.height)},1300);
    }

    /* Celebrate */
    function celebrate(){
      const name=(nameInput.value||'Developer').trim();
      wish.innerText=`Happy New Year, ${name}! Keep Coding & Winning.`;

      const url=new URL(location.href);
      url.searchParams.set('name',name);
      share.innerText=url.toString();

      qr.innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url.toString())}" />`;

      firework();confettiBurst();popSound.play();bgMusic.play();

      fetch(`https://api.countapi.xyz/hit/${COUNTER_KEY}`).then(r=>r.json()).then(d=>counterEl.innerText=d.value);
    }

    /* Auto from link */
    const qp=new URLSearchParams(location.search).get('name');
    if(qp){nameInput.value=qp;setTimeout(celebrate,900)}

    onresize=()=>{fireworks.width=confetti.width=innerWidth;fireworks.height=confetti.height=innerHeight}
  </script>

</body>
</html>
